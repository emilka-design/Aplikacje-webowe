<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game">
      <canvas id="canvas" width="288" height="512"></canvas>

      <div id="start-screen" class="overlay">
        <h1>Flappy Bird</h1>
        <p>Naciśnij <b>SPACJĘ</b>, aby zacząć</p>
      </div>

      <div id="gameover-screen" class="overlay hidden">
        <h1>Game Over</h1>
        <p>Twój wynik: <span id="last-score">0</span></p>
        <p>Najlepszy wynik: <span id="best-score">0</span></p>
        <h3>TOP 5</h3>
        <ol id="top5"></ol>
        <button id="restart-btn">Zagraj ponownie</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
